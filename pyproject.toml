[project]
name = "rag-rbac-chatbot-01"
version = "0.1.0"
description = "Internal Chatbot with Role Based Access Control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb",
    "fastapi[standard]>=0.115.12",
    "langgraph",
    "ollama",
    "openai",
    "pandas",
    "pyyaml",
    "qdrant-client",
    "sentence-transformers",
]

[project.optional-dependencies]
web = ["requests", "streamlit"]
dev = ["pytest"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --ignore=tests/e2e"
markers = [
    "unit: isolated deterministic logic tests",
    "integration: deterministic component and API boundary tests",
    "security: deterministic authorization and adversarial evaluations",
    "e2e: explicitly invoked live-stack tests",
    "model_dependent: tests that require a running vector database and LLM",
]
